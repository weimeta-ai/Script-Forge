# =============================================================================
# docker-compose.yml
# -----------------------------------------------------------------------------
# 作用：定义本地开发环境的三件套（PostgreSQL + Redis + MinIO）
#
# 【前端转全栈知识点】
# Docker Compose 是什么：
#   一个命令同时启动多个相互配合的服务。类比 package.json 的 scripts 字段，
#   但启动的是"系统服务"而不是"脚本"。
#
# 为什么用 .yml 而不是 .json：
#   yml 支持注释（# 开头），json 不支持。配置文件必须能写注释。
#
# 常用命令：
#   docker compose up -d       启动（后台运行）
#   docker compose ps          查看状态
#   docker compose logs -f     看日志（实时）
#   docker compose down        停止（保留数据）
#   docker compose down -v     停止 + 删除所有数据（慎用）
# =============================================================================

services:
  # ===========================================================================
  # 1. PostgreSQL 16 - 主数据库
  # ---------------------------------------------------------------------------
  # 用途：存储所有业务数据（用户、项目、剧本、分析报告等）
  # 端口：5432（PostgreSQL 默认端口）
  # 镜像：postgres:16-alpine（alpine = 精简版，体积小约 100MB）
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: drama-postgres      # 容器名（方便日志查看）
    restart: unless-stopped             # 重启策略：除非手动停止，否则自动重启
    ports:
      - '127.0.0.1:5432:5432'           # 仅本机访问，避免数据库暴露到公网
    environment:
      # 这些环境变量会被 PostgreSQL 启动脚本读取
      # 第一次启动时会自动创建数据库 + 用户
      POSTGRES_DB: ${POSTGRES_DB:-drama_predict}
      POSTGRES_USER: ${POSTGRES_USER:-drama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in backend/.env}
      TZ: Asia/Shanghai                 # 时区，时间字段会用这个
    volumes:
      # 数据持久化：把容器内的 /var/lib/postgresql/data 映射到 Docker 管理的卷
      # 这样删容器数据也不会丢
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 健康检查：每 5 秒检查一次 PG 是否就绪
      # 就绪后才会被其他服务依赖
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-drama}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 2. Redis 7 - 缓存 + 任务队列
  # ---------------------------------------------------------------------------
  # 用途：
  #   - BullMQ 任务队列（异步执行 LLM 分析/封面生成）
  #   - SSE 进度推送的 Pub/Sub 通道
  # 端口：6379（Redis 默认端口）
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: drama-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'           # 仅本机访问，避免 Redis 暴露到公网
    # appendonly yes = 开启 AOF 持久化（断电不丢队列任务）
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # 3. MinIO - 对象存储（S3 兼容）
  # ---------------------------------------------------------------------------
  # 用途：存储导出的 PDF / Word / Markdown / ZIP 文件
  #
  # 为什么不存数据库：
  #   - 数据库存大文件会让表变得巨大，查询变慢
  #   - 对象存储专门优化大文件读写，CDN 友好
  #
  # 端口：
  #   9000 = API 端口（后端代码连这个）
  #   9001 = 控制台端口（浏览器访问这个看 UI）
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: drama-minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'           # API 端口，仅本机访问
      - '127.0.0.1:9001:9001'           # 控制台端口，仅本机访问
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in backend/.env}
    # 启动命令：server 模式 + 开启控制台
    command: server /data --console-address ':9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

# =============================================================================
# 数据卷声明
# -----------------------------------------------------------------------------
# 作用：让容器数据"持久化"到主机，删容器数据不丢
#
# 类比：
#   容器 = 一次性纸杯（删了就没了）
#   数据卷 = 水瓶（永久保存）
#   把容器的数据目录"挂载"到数据卷，数据就永久了
# =============================================================================
volumes:
  pgdata:
  redisdata:
  miniodata:
