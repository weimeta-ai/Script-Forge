# =============================================================================
# docker-compose.prod.yml - 生产环境合并部署
# -----------------------------------------------------------------------------
# 一次启动 4 个服务：
#   1. postgres  主数据库
#   2. redis     任务队列 + SSE Pub/Sub
#   3. minio     对象存储
#   4. app       前后端合并的应用（单容器内同时跑 Hono server + BullMQ worker）
#
# 启动顺序：postgres/redis/minio 健康后，app 才启动
#
# 【架构说明】app 容器内通过 docker-entrypoint.sh 同时启动：
#   - HTTP server  (node dist/server.js)        ← 监听 5174，提供 API + 前端静态文件
#   - BullMQ worker (node dist/workers/index.js) ← 消费 analyze/cover 队列
# 任一进程退出 → 容器退出 → docker 自动重启。
#
# 使用：
#   1. cp .env.example .env.production
#   2. 编辑 .env.production 改密码、JWT_SECRET、LLM_API_KEY、CORS_ORIGIN
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   4. 首次启动后执行迁移：
#      docker compose -f docker-compose.prod.yml exec app pnpm db:migrate
#      docker compose -f docker-compose.prod.yml exec app pnpm db:seed
# =============================================================================

services:
  # ===========================================================================
  # 1. PostgreSQL - 主数据库
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: drama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drama_predict}
      POSTGRES_USER: ${POSTGRES_USER:-drama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须配置}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-drama}']
      interval: 5s
      timeout: 5s
      retries: 5
    # 生产环境不暴露 PG 端口到公网（如需外部访问，按需放开）

  # ===========================================================================
  # 2. Redis - 任务队列
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: drama-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # 3. MinIO - 对象存储
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: drama-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须配置}
    command: server /data --console-address ':9001'
    volumes:
      - miniodata:/data
    ports:
      - '9001:9001'                            # 控制台端口（生产可去掉，仅调试用）
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # 4. app - 前后端合并的应用（本仓库构建）
  # -------------------------------------------------------------------------
  # 单容器同时跑两个进程（由 Dockerfile 的 CMD /app/backend/docker-entrypoint.sh 启动）：
  #   - HTTP server  (node dist/server.js)         ← 提供 API + 前端静态文件
  #   - BullMQ worker (node dist/workers/index.js) ← 消费 analyze/cover 队列
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drama-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # 应用容器内连其他服务用服务名（不走 localhost）
      NODE_ENV: production
      PORT: 5174
      STATIC_ROOT: /app/dist

      # 数据库（容器间通信用服务名 postgres）
      DATABASE_URL: postgres://${POSTGRES_USER:-drama}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-drama_predict}

      # Redis
      REDIS_URL: redis://redis:6379

      # MinIO（容器内连 minio 服务名）
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须配置}
      MINIO_BUCKET: ${MINIO_BUCKET:-drama-exports}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须配置}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}

      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY 必须配置}
      LLM_MODEL: ${LLM_MODEL:-qwen-max}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}

      # CORS（前端同源后不需要跨域；保留多域名兜底）
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      # OSS 图床（可选）
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
      OSS_PATH_PREFIX: ${OSS_PATH_PREFIX:-drama/images}
      OSS_TIMEOUT_MS: ${OSS_TIMEOUT_MS:-60000}

      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '5174:5174'                            # 唯一对外端口：前端 + API
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5174/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s                        # 容器启动 30s 后才开始健康检查

  # ===========================================================================
  # 原 worker 独立服务已移除
  # -------------------------------------------------------------------------
  # worker 现在由 app 容器内的 docker-entrypoint.sh 同时启动（单容器多进程方案）。
  # 这样适配 Coolify 等单容器 PaaS 部署，也避免本地 docker run 时 worker 需要单独起的坑。
  # 如需独立扩缩容 worker（如 analyze 量大），可恢复本服务并 app 容器通过环境变量
  # WORKER_ENABLED=false 禁用内置 worker（届时需 entrypoint.sh 增加该判断逻辑）。
  # ===========================================================================

volumes:
  pgdata:
  redisdata:
  miniodata:
